<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherill Construction Company - Interview Portal</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 60px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      color: #0b4f8a;
      font-size: 42px;
      margin-bottom: 20px;
    }

    h2 {
      color: #444;
      font-size: 30px;
      margin-bottom: 45px;
    }

    p {
      color: #444;
      font-size: 22px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      background: #087cf5;
      color: white;
      text-decoration: none;
      padding: 20px 35px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .button:hover {
      background: #0668d4;
    }

    footer {
      margin-top: 70px;
      color: #777;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Welcome to Sherill<br>Construction Company</h1>

    <h2>Interview Portal</h2>

    <p>
      Please click below to continue to your scheduled interview.
    </p>

    <a class="button"
       href="https://sherill122.github.io/interview/"
       target="_blank"
       rel="noopener noreferrer">
       Join Interview
    </a>

    <footer>
      Sherill Construction Company © 2026<br>
      Human Resources Department
    </footer>

  </div>

</body>
</html>
