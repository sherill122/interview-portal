<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherill Construction Company - Interview Application</title>
</head>
<body>

  <h1>Sherill Construction Company</h1>
  <h2>Interview Application</h2>

  <form>
    <label>Full Name</label><br>
    <input type="text" name="fullname"><br><br>

    <label>Email Address</label><br>
    <input type="email" name="email"><br><br>

    <label>Phone Number</label><br>
    <input type="tel" name="phone"><br><br>

    <label>Position Applied For</label><br>
    <input type="text" name="position"><br><br>

    <label>Tell us about yourself</label><br>
    <textarea name="about" rows="6" cols="40"></textarea><br><br>

    <button type="submit">Submit Application</button>
  </form>

</body>
</html>
